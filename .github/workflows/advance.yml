name: Advance submodules

# This workflow uses KUIPER_ADVANCE_GH_TOKEN (a fine-grained PAT) to push to
# the FStar and karamel submodule repos, and to push the advance branch and
# open its PR in this repo. It must be a PAT rather than GITHUB_TOKEN for the
# latter: pushes and PRs made with GITHUB_TOKEN do not trigger workflow runs,
# so the required `ciok` check would never appear and auto-merge would hang.
# To renew/recreate the token:
#
# 1. Go to https://github.com/settings/personal-access-tokens/new
# 2. Set resource owner to "FStarLang"
# 3. Under "Repository access", select "FStarLang/FStar", "FStarLang/karamel"
#    and "FStarLang/kuiper"
# 4. Under "Permissions > Repository permissions", set "Contents" to "Read and
#    write" and "Pull requests" to "Read and write"
# 5. Generate the token
# 6. Update the secret at: https://github.com/FStarLang/kuiper/settings/secrets/actions
#    (secret name: KUIPER_ADVANCE_GH_TOKEN)

on:
  # Manually triggered
  workflow_dispatch:
  schedule:
    # Or once a day
    - cron: '0 0 * * *'

# When updating this tag, also update .devcontainer/devcontainer.json
# and ci.yml.
jobs:
  build:
    # No GPU needed here: this job only verifies, extracts and regenerates
    # dist/, and the CUDA tests it used to run are already covered by the CI
    # run on the PR it opens below. Running on a GitHub-hosted runner keeps the
    # nightly advance from occupying the single self-hosted runner for hours.
    runs-on: ubuntu-latest
    container:
      # No need for CUDA.
      image: ghcr.io/fstarlang/kuiper-base-nocuda:latest
    defaults:
      run:
        shell: bash
    steps:
      - run: find . -delete
      - name: Check out repo
        uses: actions/checkout@v6
        with:
          submodules: recursive
          # Full history is needed so try-rebase.sh can rebase the submodule
          # branches onto upstream/master without shallow-clone conflicts.
          fetch-depth: 0
          # Don't persist the github-actions[bot] credentials: checkout injects
          # them as an http.extraheader into each submodule's git config, which
          # would override the PAT in the push URLs we use for FStar/karamel
          # below (resulting in a 403). We set explicit tokens per-push instead.
          persist-credentials: false

      - name: Install GitHub CLI
        run: |
          curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg | sudo dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | sudo tee /etc/apt/sources.list.d/github-cli.list > /dev/null
          sudo apt-get update && sudo apt-get install -y gh

      - name: Setup HOME and PATH
        run: |
          echo "HOME=/home/vscode" >> $GITHUB_ENV
          echo "PATH=/home/vscode/bin:$PATH" >> $GITHUB_ENV

      - name: Configure git
        run: |
          git config --global user.name "Actions bot"
          git config --global user.email "none@none"
          # Credential persistence is disabled on checkout, so set an explicit
          # token for pushing to this (kuiper) repository. We use the PAT and
          # not GITHUB_TOKEN: a branch pushed with GITHUB_TOKEN does not start
          # a CI run, and the advance PR needs one to be mergeable.
          git remote set-url origin https://${{ secrets.KUIPER_ADVANCE_GH_TOKEN }}@github.com/${{ github.repository }}

      - name: Check KUIPER_ADVANCE_GH_TOKEN is set
        env:
          TOKEN: ${{ secrets.KUIPER_ADVANCE_GH_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::KUIPER_ADVANCE_GH_TOKEN secret is not set. See instructions at the top of this workflow file."
            exit 1
          fi

      - run: |
          ./try-rebase.sh
          if ! git diff --quiet; then
            echo MOVED=1 >>$GITHUB_ENV
          else
            echo MOVED=0 >>$GITHUB_ENV
          fi

      - name: Build and regenerate dist/
        if: ${{ env.MOVED == '1' }}
        run: |
          eval $(opam env)
          # We just regenerate dist admitting queries.  We will anyway open a PR
          # that needs to pass CI, so there's not a big gain in testing
          # everything again here.
          make -skj$(nproc) dist ADMIT=1
          # Did something change?
          git add dist # must reset!
          git reset dist/BUILD_INFO # ignore build info changes
          if ! git diff --quiet --cached dist; then
            echo DISTCHANGE=1 >>$GITHUB_ENV
            git add dist/BUILD_INFO # but commit them if we're updating...
          else
            echo DISTCHANGE=0 >>$GITHUB_ENV
          fi
          git reset

      - name: Push submodule objects
        if: ${{ env.MOVED == '1' }}
        run: |
          # Use the token so we can push to these repos.
          for dir in FStar karamel; do
            pushd $dir
            echo "in $(pwd)"
            R=$(git remote get-url origin | grep -Eo '[[:alnum:]]*/[[:alnum:]]*$')
            echo R=$R
            git remote set-url origin https://${{ secrets.KUIPER_ADVANCE_GH_TOKEN }}@github.com/$R
            popd
          done
          # Make the rebased commits reachable on the remotes so the submodule
          # pointers in the PR resolve. The _kuiper branches are *not* moved
          # here: they track what main pins, so sync-kuiper-branches advances
          # them when (and only when) this PR lands on main.
          ./push-submodules.sh

      - name: Open the advance PR
        if: ${{ env.MOVED == '1' }}
        env:
          GH_TOKEN: ${{ secrets.KUIPER_ADVANCE_GH_TOKEN }}
        run: |
          BRANCH=advance/submodules

          if [ "$DISTCHANGE" = 1 ]; then
            TITLE="Advance submodules (dist changed)"
            BODY="Automated submodule advance. It also changes \`dist/\`, so auto-merge is *not* enabled: please review."
          else
            TITLE="Advance submodules"
            BODY="Automated submodule advance, with no changes to \`dist/\`. Auto-merge is enabled: this merges itself once CI is green."
          fi

          git checkout -b "$BRANCH"
          if [ "$DISTCHANGE" = 1 ]; then
            git add .
          else
            git add FStar karamel
          fi
          git commit -m "$TITLE"
          git push -f origin "$BRANCH"

          # Create the PR, or reuse the one a previous run left open.
          PR=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number')
          if [ -n "$PR" ]; then
            gh pr edit "$PR" --title "$TITLE" --body "$BODY"
            echo "Updated existing PR #$PR"
          else
            gh pr create --title "$TITLE" --body "$BODY"
            PR=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number')
          fi

          if [ "$DISTCHANGE" = 1 ]; then
            # A previous run may have armed auto-merge on this PR; a dist
            # change needs a human to look at it.
            gh pr merge "$PR" --disable-auto || true
          else
            gh pr merge "$PR" --auto --rebase
          fi
